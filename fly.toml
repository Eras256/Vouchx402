app = "vouch402"
primary_region = "dfw"

[build]

[env]
  PORT = "3402"
  NETWORK = "base"
  DB_PATH = "/data/vouch402.sqlite"
  PRICE_USDC = "0.01"

[[mounts]]
  source = "vouch402_data"
  destination = "/data"

[http_service]
  internal_port = 3402
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/v1/metrics"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
